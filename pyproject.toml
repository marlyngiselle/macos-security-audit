[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macaudit"
dynamic = ["version"]
description = "Read-only macOS security posture audit with JSON, Markdown and SARIF output."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Giselle Da Costa" }]
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Environment :: Console",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
macaudit = "macaudit.cli:main"

[tool.setuptools]
packages = ["macaudit"]

[tool.setuptools.dynamic]
version = { attr = "macaudit.__version__" }

[tool.setuptools.package-data]
macaudit = ["data/*.json"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S603",   # subprocess without shell: argv comes from the reviewed catalogue
  "S607",   # partial executable paths: tools are resolved on PATH on purpose
  "UP006",  # keep typing.List and friends for Python 3.9 readers
  "UP035",
  "UP045",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["macaudit", "tests"]

[[tool.mypy.overrides]]
module = ["jsonschema"]
ignore_missing_imports = true
